  to     = "/invest"
  status = 301

[[redirects]]
  from   = "/property-management-hobart-tasmania"
  to     = "/contact"
  status = 301

# ── 404 fallback ───────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

# ── Security headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Keep private pages out of Google ───────────────────────────────────────
[[headers]]
  for = "/coach"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/coach.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Cache static assets ────────────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

